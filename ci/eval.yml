name: Eval Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and run agent quality gate
        working-directory: 06-lab-complete/benchmark-observability/develop
        run: |
          pip install -r requirements.txt
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8002 python app.py &
          SERVER_PID=$!
          sleep 3
          python eval/run_eval.py --url http://localhost:8002 --min-accuracy 0.85 --out reports/eval_ci.json
          kill $SERVER_PID 2>/dev/null || true
